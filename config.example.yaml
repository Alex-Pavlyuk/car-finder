# ── Что и где ищем ────────────────────────────────────────────────────────────
# Все жёсткие критерии применяются на стороне сайтов (otomoto/olx),
# поэтому изменение любого поля тут меняет и сам поисковый запрос.

location:
  city: warszawa         # город-центр поиска (латиницей, как в URL otomoto/olx) — подставьте свой
  city_lat: 52.2297      # координаты города — для расчёта расстояния до объявления
  city_lon: 21.0122
  radius_km: 100         # ~1 час езды. Допустимые значения обоих сайтов: 5,10,15,25,50,75,100,150

criteria:
  price_max: 80000       # PLN — пример, подставьте свой бюджет
  price_min: 10000       # отсекает битые/распил/«под восстановление»
  year_from: 2016
  mileage_max: 250000    # km, 0 = без ограничения
  body_types: [suv]      # otomoto/olx: mini, city-car, coupe, cabrio, combi, compact, minivan, sedan, suv
  gearboxes: [automatic] # automatic | manual
  drives:                # только полный привод
    - all-wheel-auto        # 4x4 подключаемый автоматически
    - all-wheel-lock        # 4x4 подключаемый вручную
    - all-wheel-permanent   # 4x4 постоянный
  exclude_damaged: true  # выбрасывать «Uszkodzony»

# Near-miss: объявления, которые провалили ТОЛЬКО по мягкому допуску.
# Попадают в отдельную вкладку отчёта, а не в основную выдачу.
near_miss:
  enabled: true
  price_overshoot_pct: 12   # цена до +12% сверх price_max
  year_slack: 1             # год на 1 меньше year_from

# ── Скоринг ───────────────────────────────────────────────────────────────────
scoring:
  base: 50

  fuel_bonus:            # пример: гибрид и ГБО дешевле в эксплуатации
    hybrid: 18
    plugin-hybrid: 16
    petrol-lpg: 14
    petrol-cng: 8
    petrol: 0
    diesel: -4
    electric: -6

  # Подстроки ищутся в «марка модель» в нижнем регистре
  model_bonus:           # примеры — впишите модели, которые вам интересны
    "toyota rav4": 10
    "honda cr-v": 8
    "mazda cx-5": 6

  mileage_bonus:         # порог km -> баллы (берётся первый подходящий сверху вниз)
    - [100000, 14]
    - [150000, 8]
    - [200000, 2]
    - [999999, -8]

  year_bonus_per_year: 3   # за каждый год новее year_from, максимум 15
  price_margin_weight: 12  # чем дешевле относительно потолка, тем больше баллов
  private_seller_bonus: 3  # частник вместо салона
  near_city_bonus: 5       # если объявление ближе 40 км
  near_city_km: 40
  foreign_origin_penalty: 3     # страна происхождения не Польша
  suspicious_price_penalty: 30  # цена сильно ниже медианы по модели — скрытая проблема
  market_delta_weight: 40       # насколько поднимать за цену ниже похожих предложений

# ── Оценка цены относительно похожих предложений ──────────────────────────────
market:
  enabled: true
  # Сколько złotych стоит километр пробега при сравнении. Нужно, чтобы «дёшево»
  # не означало просто «больше проехало»: цены сопоставимых машин приводятся
  # к пробегу оцениваемой.
  price_per_km: 0.12

# ── Уведомления macOS ─────────────────────────────────────────────────────────
notify:
  enabled: true
  min_score: 70    # ниже — не беспокоить, иначе уведомления превращаются в шум
  max_per_run: 5

# ── Проверка описаний ─────────────────────────────────────────────────────────
# Отсеивает то, что не видно по полям объявления: «авто под заказ из США,
# цена ориентировочная», цессию лизинга, битые машины, помеченные как целые.
# У OLX описание приходит вместе с выдачей (бесплатно), у otomoto нужен запрос
# страницы объявления — он делается один раз за жизнь объявления и кешируется.
verify:
  enabled: true
  max_per_run: 80    # максимум загрузок страниц объявлений за прогон
  min_score: 45      # объявления слабее не проверяем — они всё равно внизу списка

# ── Источники ─────────────────────────────────────────────────────────────────
sources:
  otomoto:
    enabled: true
    max_pages: 12        # 32 объявления на страницу
  olx:
    enabled: true
    max_pages: 12        # 50 объявлений на страницу

# ── Прочее ────────────────────────────────────────────────────────────────────
runtime:
  request_delay_sec: 1.2   # пауза между запросами к одному сайту
  timeout_sec: 40
  retries: 3
  stale_after_days: 21     # объявление, не встреченное дольше — помечается «пропало»

# ── Распознавание текста на фото ──────────────────────────────────────────────
# Часть салонов не пишет о брони в описании, а закрывает первое фото баннером
# «REZERWACJA». Такие объявления отличимы только по пикселям, поэтому превью
# прогоняется через Vision, встроенный в macOS (офлайн, без внешних сервисов).
# Результат кешируется по URL картинки.
photo:
  enabled: true
  max_per_run: 400   # ~0,3 c на картинку; кеш делает повторные прогоны бесплатными

# ── Отчёт ─────────────────────────────────────────────────────────────────────
report:
  # Начальное положение ползунка «на сайте до N дн.» в дашборде.
  # Это фильтр отображения, а не отбраковка: объявления собираются все,
  # и ползунок в отчёте можно в любой момент сдвинуть на «все».
  # Долго висящее объявление обычно переоценено — свежие разбирают быстро.
  max_days_default: 100

# ── Приложение в строке меню ──────────────────────────────────────────────────
app:
  interval_minutes: 30   # как часто обновлять, пока приложение запущено
